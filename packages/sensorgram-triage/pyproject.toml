[project]
name = "sensorgram-triage"
version = "0.0.1"
description = "Auto-sort binding curves into publishable / review / re-run, and quantify how many need no human eye."
requires-python = ">=3.12"
dependencies = [
    "adaptyv-core",
    "adaptyv-kinetics",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "typer>=0.12",
]

[project.scripts]
sensorgram-triage = "sensorgram_triage.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensorgram_triage"]
