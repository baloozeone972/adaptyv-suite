[project]
name = "campaign-planner"
version = "0.0.1"
description = "Given a budget and an objective, enumerate valid experiment strategies — including two-step sequential ones — and rank them."
requires-python = ">=3.12"
dependencies = [
    "adaptyv-core",
    "numpy>=1.26",
    "typer>=0.12",
]

[project.scripts]
campaign-planner = "campaign_planner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/campaign_planner"]
