[project]
name = "adaptyv-kinetics"
version = "0.0.1"
description = "Read Adaptyv's binding data package, re-fit kinetics independently, flag artifacts, and report — in one command."
requires-python = ">=3.12"
dependencies = [
    "adaptyv-core",
    "numpy>=1.26",
    "scipy>=1.11",
    "polars>=1.0",
    "matplotlib>=3.8",
    "typer>=0.12",
    "protviz",
]

[project.scripts]
adaptyv-kinetics = "adaptyv_kinetics.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptyv_kinetics"]
