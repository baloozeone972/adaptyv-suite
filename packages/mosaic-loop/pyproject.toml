[project]
name = "mosaic-loop"
version = "0.0.1"
description = "Close Mosaic's loop: feed Adaptyv's measurements back to recalibrate its predicted objective terms, and report where prediction drifts from reality."
requires-python = ">=3.12"
dependencies = [
    "adaptyv-core",
    "numpy>=1.26",
    "typer>=0.12",
]

[project.scripts]
mosaic-loop = "mosaic_loop.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mosaic_loop"]
