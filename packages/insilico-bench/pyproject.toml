[project]
name = "insilico-bench"
version = "0.0.1"
description = "Measure which in-silico scores actually predict wet-lab outcome — a reproducible harness, not a one-off analysis."
requires-python = ">=3.12"
dependencies = [
    "adaptyv-core",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "typer>=0.12",
]

[project.scripts]
insilico-bench = "insilico_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insilico_bench"]
