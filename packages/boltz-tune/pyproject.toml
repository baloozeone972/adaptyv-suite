[project]
name = "boltz-tune"
version = "0.0.1"
description = "A reproducible harness to measure whether fine-tuning an affinity model on Adaptyv data helps — and how much data a real gain would need."
requires-python = ">=3.12"
dependencies = [
    "adaptyv-core",
    "numpy>=1.26",
    "scipy>=1.11",
    "typer>=0.12",
]

[project.scripts]
boltz-tune = "boltz_tune.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boltz_tune"]
