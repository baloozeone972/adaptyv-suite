[project]
name = "adaptyv-pipeline"
version = "0.0.1"
description = "Make the Adaptyv wet lab a declarative, reproducible pipeline step: cost dry-run, resume, ML-tracker logging."
requires-python = ">=3.12"
dependencies = [
    "adaptyv-core",
    "adaptyv-kinetics",
    "typer>=0.12",
]

[project.scripts]
adaptyv-pipeline = "adaptyv_pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptyv_pipeline"]
