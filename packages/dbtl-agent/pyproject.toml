[project]
name = "dbtl-agent"
version = "0.0.1"
description = "A governance-first autonomous DBTL loop: select, guard the spend, submit, learn, repeat — with a hard budget and a tamper-evident audit."
requires-python = ">=3.12"
dependencies = [
    "adaptyv-core",
    "binder-triage",
    "numpy>=1.26",
    "typer>=0.12",
]

[project.scripts]
dbtl-agent = "dbtl_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbtl_agent"]
