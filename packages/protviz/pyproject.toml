[project]
name = "protviz"
version = "0.0.1"
description = "Visualisation primitives for experimentally-validated protein design: sensorgrams, kinetic maps, censored KD, calibration, hit-rate@budget."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/protviz"]
