[project]
name = "preflight"
version = "0.0.1"
description = "Pre-submission linter for Adaptyv experiments: catch format and platform errors before they cost a well."
requires-python = ">=3.12"
dependencies = [
    "adaptyv-core",
    "typer>=0.12",
]

[project.scripts]
preflight = "preflight.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight"]
